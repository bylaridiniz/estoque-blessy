<style>
/* Layout: ferramenta interna — trilho lateral de navegação + área de trabalho; no celular o trilho vira faixa no topo. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EAF0EC; --line:#D7E0DA; --ink:#16211B; --muted:#5B6A62;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D9EEEA;
  --ok:#23824F; --ok-soft:#DDF1E5; --warn:#A86A06; --warn-soft:#FBEFD6; --bad:#BE3A33; --bad-soft:#F9E0DD; --zero:#2F3532; --zero-soft:#E3E6E4;
  --info:#3D5BA9; --info-soft:#E1E8F7;
  --shadow:0 1px 2px rgba(22,33,27,.06),0 4px 16px rgba(22,33,27,.05);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --line:#2A3631; --ink:#E4EDE8; --muted:#92A199;
  --accent:#4CC0B4; --accent-ink:#06211E; --accent-soft:#17332F;
  --ok:#5CC48B; --ok-soft:#173326; --warn:#E3AB4A; --warn-soft:#352914; --bad:#F07C72; --bad-soft:#3A1D1A; --zero:#B5BDB8; --zero-soft:#262D2A;
  --info:#8AA5EE; --info-soft:#1C2540; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1B2521; --line:#2A3631; --ink:#E4EDE8; --muted:#92A199;
  --accent:#4CC0B4; --accent-ink:#06211E; --accent-soft:#17332F;
  --ok:#5CC48B; --ok-soft:#173326; --warn:#E3AB4A; --warn-soft:#352914; --bad:#F07C72; --bad-soft:#3A1D1A; --zero:#B5BDB8; --zero-soft:#262D2A;
  --info:#8AA5EE; --info-soft:#1C2540; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.02em}
.brand span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;font-weight:700}
.rail-foot{margin-top:auto;font-size:.8rem;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--bad)}

main{padding-block:24px 64px;padding-inline:28px;min-width:0;max-width:1320px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{color:var(--muted);margin-top:4px;max-width:68ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.basestrip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:18px}
.basestrip .tag{font-family:var(--f-mono);font-size:.78rem;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:6px;font-weight:500}
.basestrip .sep{color:var(--line)}.basestrip .sep:last-of-type{display:none}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:var(--ink)}a.btn.primary{color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.metric .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.metric .val{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.15}
.metric .sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.metric.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.metric.hero .lab,.metric.hero .sub{color:inherit;opacity:.82}
.metric.click{cursor:pointer}
.metric.click:hover{border-color:var(--accent)}
.val.neg{color:var(--bad)} .val.pos{color:var(--ok)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:1.05rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.84rem;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.num{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
td.strong{font-weight:700}
.prod{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.saudavel,.pill.ok,.pill.nova{background:var(--ok-soft);color:var(--ok)}
.pill.baixo,.pill.warn,.pill.anterior{background:var(--warn-soft);color:var(--warn)}
.pill.critico,.pill.bad,.pill.erro{background:var(--bad-soft);color:var(--bad)}
.pill.zerado{background:var(--zero-soft);color:var(--zero)}
.pill.sem_minimo,.pill.neutral,.pill.duplicada{background:var(--surface-2);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.delta-neg{color:var(--bad)} .delta-pos{color:var(--ok)}

.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:14px}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.notice.ok{background:var(--ok-soft);border-color:transparent}
.notice b{font-weight:700}
.notice .grow{flex:1;min-width:0}

/* Importação */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.86rem;color:var(--muted);font-weight:600}
.step i{font-style:normal;font-family:var(--f-mono);font-size:.78rem}
.step.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step.done{color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:1.15rem}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:600;font-size:.88rem}
.field .hint{font-size:.78rem;color:var(--muted)}
.req{color:var(--bad)}
.summary-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.confirmbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:16px 18px;margin-top:16px}
.confirmbar h3{font-size:1.1rem}
.kv{display:flex;flex-wrap:wrap;gap:4px 6px}
.kv span{background:var(--surface-2);border-radius:6px;padding:2px 7px;font-size:.8rem}
.kv span b{font-weight:600;color:var(--muted);margin-right:4px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.modal.wide{width:min(920px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ink);color:var(--surface)}

/* Auditoria */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.calc .card{padding:10px 12px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:128px minmax(0,1fr) 80px 80px;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:center}
.tl.basehead{background:var(--accent-soft);border-radius:8px;border-bottom:none;padding:10px 10px;margin:6px 0}
.tl.final{background:var(--ink);color:var(--surface);border-radius:8px;border-bottom:none;padding:12px 10px;margin-top:8px;font-weight:700}
.tl.countinfo{background:var(--info-soft);border-radius:8px;border-bottom:none;margin:4px 0;padding:9px 10px}
.tl.reversed .what{text-decoration:line-through;opacity:.6}
.tl .when{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tl.final .when,.tl.basehead .when{color:inherit}
.tl .run{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.tl.final .run{color:inherit}
details.period{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:10px}
details.period summary{cursor:pointer;font-weight:600;padding:4px 0}

.toast-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:80;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:420px;pointer-events:auto;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}

.errcard{display:flex;flex-direction:column;gap:10px}
.errcard .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.errlist{display:flex;flex-direction:column;gap:10px}
.solution{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted)}
.test-step{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.test-step:last-child{border-bottom:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--line);overflow:hidden}
  .brand{padding:0;flex:none}.brand span{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav a{padding:7px 10px;white-space:nowrap}
  .rail-foot{display:none}
  main{padding-inline:16px;padding-block:18px 60px}
  .two,.form2{grid-template-columns:1fr}
  .tl{grid-template-columns:96px minmax(0,1fr) 64px;}
  .tl .run{display:none}
  .search{min-width:0;flex:1}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}

<script>
/* ===== Núcleo do ledger: funções puras, sem DOM (testáveis isoladamente) ===== */
const Core = (() => {
  'use strict';

  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
  const pad = n => String(n).padStart(2, '0');
  const naive = (y, mo, d, h, mi, s) => `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}:${pad(s)}`;
  const isBlank = v => v == null || String(v).trim() === '';

  function nowNaive() {
    const d = new Date();
    return naive(d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds());
  }

  function validYMD(y, mo, d) {
    if (!(y >= 2000 && y <= 2100) || mo < 1 || mo > 12 || d < 1) return false;
    return d <= new Date(y, mo, 0).getDate();
  }

  /* Hora isolada: "14:01", "14h", "14:01:30", fração do Excel (0.5 = 12:00) ou Date. */
  function parseTime(v) {
    if (isBlank(v)) return null;
    if (v instanceof Date) return isNaN(v) ? undefined : { h: v.getHours(), mi: v.getMinutes(), s: v.getSeconds() };
    if (typeof v === 'number') {
      let secs = Math.round((v - Math.floor(v)) * 86400);
      if (secs >= 86400) secs = 86399;
      return { h: Math.floor(secs / 3600), mi: Math.floor((secs % 3600) / 60), s: secs % 60 };
    }
    const m = String(v).trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?(?::(\d{2}))?/);
    if (!m) return undefined;
    const h = +m[1], mi = +(m[2] || 0), s = +(m[3] || 0);
    if (h > 23 || mi > 59 || s > 59) return undefined;
    return { h, mi, s };
  }

  /* Data/hora em formato brasileiro, ISO, Date ou número serial do Excel.
     Retorna valor "ingênuo" (sem fuso) YYYY-MM-DDTHH:mm:ss para comparação direta. */
  function parseDateTime(v, timeV) {
    if (isBlank(v)) return { ok: false, error: 'Data vazia' };
    let y, mo, d, h = 0, mi = 0, s = 0, hasTime = false;
    if (v instanceof Date) {
      if (isNaN(v)) return { ok: false, error: 'Data inválida' };
      y = v.getFullYear(); mo = v.getMonth() + 1; d = v.getDate();
      h = v.getHours(); mi = v.getMinutes(); s = v.getSeconds();
      hasTime = !!(h || mi || s);
    } else if (typeof v === 'number') {
      if (!(v > 20000 && v < 80000)) return { ok: false, error: `Número "${v}" não parece uma data` };
      const days = Math.floor(v);
      const dt = new Date(Date.UTC(1899, 11, 30) + days * 86400000);
      y = dt.getUTCFullYear(); mo = dt.getUTCMonth() + 1; d = dt.getUTCDate();
      if (v - days > 1e-7) { const t = parseTime(v); h = t.h; mi = t.mi; s = t.s; hasTime = true; }
    } else {
      const str = String(v).trim();
      let m = str.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})(?:[\sT,]+(?:[aà]s\s*)?(\d{1,2})\s*[:hH]\s*(\d{2})?(?::(\d{2}))?)?/i);
      if (m) {
        d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000;
        if (m[4] != null) { h = +m[4]; mi = +(m[5] || 0); s = +(m[6] || 0); hasTime = true; }
      } else if ((m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))) {
        y = +m[1]; mo = +m[2]; d = +m[3];
        if (m[4] != null) { h = +m[4]; mi = +m[5]; s = +(m[6] || 0); hasTime = true; }
      } else {
        return { ok: false, error: `Formato de data não reconhecido: "${str}"` };
      }
    }
    if (!validYMD(y, mo, d)) return { ok: false, error: 'Data inexistente no calendário' };
    if (h > 23 || mi > 59 || s > 59) return { ok: false, error: 'Horário inválido' };
    if (!isBlank(timeV)) {
      const t = parseTime(timeV);
      if (t === undefined) return { ok: false, error: `Hora inválida: "${timeV}"` };
      h = t.h; mi = t.mi; s = t.s; hasTime = true;
    }
    return { ok: true, value: naive(y, mo, d, h, mi, s), hasTime };
  }

  /* Quantidade: aceita "1.000", "1,0", "15 un". Negativa vira valor absoluto + flag. */
  function parseQty(v) {
    if (isBlank(v)) return { ok: false, error: 'Quantidade vazia' };
    let n;
    if (typeof v === 'number') n = v;
    else {
      let s = String(v).trim().replace(/\s/g, '').replace(/(unidades?|unid|und|un|pcs?|pç)\.?$/i, '');
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
      if (!/^-?\d+(\.\d+)?$/.test(s)) return { ok: false, error: `Quantidade não numérica: "${v}"` };
      n = parseFloat(s);
    }
    if (!isFinite(n)) return { ok: false, error: 'Quantidade inválida' };
    if (n === 0) return { ok: false, error: 'Quantidade igual a zero' };
    if (Math.abs(n - Math.round(n)) > 1e-9) return { ok: false, error: `Quantidade fracionada (${v})` };
    return { ok: true, value: Math.abs(Math.round(n)), negative: n < 0 };
  }

  /* Tipo: retorna 'ENTRADA', 'SAIDA', null (vazio) ou undefined (desconhecido). */
  function parseTipo(raw) {
    const t = norm(raw);
    if (!t) return null;
    if (['e', 'ent', '+', 'in'].includes(t) || /entrada|compra|devolu|receb|retorno|reposi/.test(t)) return 'ENTRADA';
    if (['s', 'sai', '-', 'out'].includes(t) || /saida|venda|pedido|baixa|expedi|envio|despach/.test(t)) return 'SAIDA';
    return undefined;
  }

  function productIndex(products) {
    const bySku = new Map(), byName = new Map();
    for (const p of products) {
      if (p.arquivado) continue;
      if (!isBlank(p.sku)) bySku.set(norm(p.sku), p.id);
      byName.set(norm(p.nome), p.id);
      for (const a of p.vinculos || []) { const k = norm(a); if (k) { bySku.set(k, p.id); byName.set(k, p.id); } }
    }
    return { bySku, byName };
  }

  const identKey = r => !isBlank(r.sku) ? 'sku:' + norm(r.sku) : (!isBlank(r.produto) ? 'nome:' + norm(r.produto) : '');

  function resolveProduct(r, idx, overrides) {
    if (r._productId) return r._productId;
    const ik = identKey(r);
    if (ik && overrides && overrides[ik]) return overrides[ik];
    const sku = norm(r.sku), nome = norm(r.produto);
    if (sku && idx.bySku.has(sku)) return idx.bySku.get(sku);
    if (nome && idx.byName.has(nome)) return idx.byName.get(nome);
    if (sku && idx.byName.has(sku)) return idx.byName.get(sku);
    return null;
  }

  /* Classifica registros já mapeados:
     anterior  -> data/hora <= contagem-base (já está na contagem)
     duplicada -> chave já existe no ledger (ou repetida no próprio arquivo)
     erro      -> não processável sem intervenção
     nova      -> será lançada no ledger */
  function classifyRecords(records, ctx) {
    const idx = productIndex(ctx.products);
    const keyInfo = new Map();
    const loose = new Map();
    for (const e of ctx.ledger) {
      if (e.key) keyInfo.set(e.key, e);
      if (e.looseKey) loose.set(e.looseKey, e);
    }
    const seen = new Set();
    const base = ctx.baseDataHora, baseDay = base.slice(0, 10), baseHM = base.slice(11, 16);

    return records.map((r, i) => {
      const it = { linha: r._linha ?? i + 1, original: r._original || null, raw: r, status: null, codigo: null, problema: null, solucao: null, parsed: {} };
      const fail = (codigo, problema, solucao) => Object.assign(it, { status: 'erro', codigo, problema, solucao });
      const P = it.parsed;

      const dt = parseDateTime(r.data, r.hora);
      if (dt.ok) P.dataHora = dt.value;
      P.pedido = isBlank(r.pedido) ? '' : String(r.pedido).trim();
      P.idUnico = isBlank(r.idUnico) ? '' : String(r.idUnico).trim();
      const q = parseQty(r.quantidade);
      if (q.ok) P.qtd = q.value;
      let tipo = parseTipo(r.tipo);
      const tipoInformado = tipo;
      if (tipo === null) tipo = q.ok && q.negative ? 'SAIDA' : (ctx.defaultTipo || 'SAIDA');
      P.tipo = tipo;
      P.productId = resolveProduct(r, idx, ctx.overrides);
      P.ident = identKey(r);

      if (!dt.ok) return fail('data_invalida', dt.error, 'Confira a coluna mapeada como Data. Formatos aceitos: 08/10/2026 14:01 ou 2026-10-08 14:01.');
      if (!dt.hasTime && dt.value.slice(0, 10) === baseDay)
        return fail('sem_horario', `Data sem horário no mesmo dia da contagem-base. Não dá para saber se aconteceu antes ou depois das ${baseHM}.`, 'Mapeie a coluna de hora ou corrija a linha informando o horário do pedido no Bling.');
      if (dt.value <= base) { it.status = 'anterior'; return it; }

      if (!P.pedido && !P.idUnico) return fail('sem_id', 'Linha sem número de pedido ou ID da movimentação.', 'Sem um identificador não dá para garantir que essa linha não será descontada duas vezes. Informe o número do pedido.');
      if (!q.ok) return fail('qtd_invalida', q.error, 'A quantidade precisa ser um número inteiro maior que zero.');
      if (tipo === undefined) return fail('tipo_desconhecido', `Tipo de movimentação desconhecido: "${r.tipo}"`, 'Corrija para Entrada ou Saída.');
      if (tipoInformado === 'ENTRADA' && q.negative) return fail('qtd_invalida', 'Quantidade negativa em uma linha marcada como entrada.', 'Confirme se é entrada ou saída e corrija o sinal.');
      if (!P.productId) {
        if (!P.ident) return fail('sem_produto', 'Linha sem SKU e sem nome de produto.', 'Informe a qual produto essa linha se refere.');
        return fail('produto_nao_encontrado', !isBlank(r.sku) ? `SKU "${r.sku}" não está cadastrado.` : `Produto "${r.produto}" não foi reconhecido.`,
          'Vincule este SKU/nome a um produto cadastrado. O vínculo fica salvo para as próximas importações.');
      }

      const key = P.idUnico ? 'U|' + norm(P.idUnico) : ['P', norm(P.pedido), P.productId, tipo, P.qtd].join('|');
      const looseKey = P.pedido ? ['P', norm(P.pedido), P.productId, tipo].join('|') : '';
      P.key = key; P.looseKey = looseKey;
      if (keyInfo.has(key)) { it.status = 'duplicada'; it.problema = `Já processada (${keyInfo.get(key).id}${keyInfo.get(key).importId ? ', importação ' + keyInfo.get(key).importId : ''})`; return it; }
      if (seen.has(key)) { it.status = 'duplicada'; it.problema = 'Repetida dentro do próprio arquivo'; it.repetidaNoArquivo = true; return it; }
      if (!P.idUnico && looseKey && loose.has(looseKey) && !r._force) {
        const prev = loose.get(looseKey);
        return fail('qtd_divergente', `O pedido ${P.pedido} já foi processado para este produto com ${Math.abs(prev.delta)} un. (${prev.id}). Agora aparece com ${P.qtd} un.`,
          'Se o pedido mudou no Bling, lance um ajuste manual com a diferença. Se for outro item do mesmo pedido, use "Processar mesmo assim".');
      }
      seen.add(key);
      it.status = 'nova';
      return it;
    });
  }

  /* Transforma itens "nova" em lançamentos do ledger. */
  function buildEntries(items, opts) {
    let seq = opts.seqStart;
    return items.filter(i => i.status === 'nova').map(i => {
      seq += 1;
      const p = i.parsed;
      return {
        id: 'M' + String(seq).padStart(6, '0'), seq,
        tipo: p.tipo, cat: p.tipo === 'ENTRADA' ? 'entradas' : 'saidas',
        delta: p.tipo === 'ENTRADA' ? p.qtd : -p.qtd,
        productId: p.productId, dataHora: p.dataHora,
        ref: p.pedido, idUnico: p.idUnico, key: p.key, looseKey: p.looseKey,
        origem: opts.origem || 'bling', importId: opts.importId || null, erroId: opts.erroId || null,
        linha: i.linha, criadoEm: opts.criadoEm
      };
    });
  }

  /* Contagem-base vigente para um instante: a última base com dataHora < instante. */
  function baseFor(counts, at) {
    return counts.filter(c => c.ehBase && c.dataHora < at).sort((a, b) => a.dataHora < b.dataHora ? 1 : -1)[0] || null;
  }

  function estimateAt(productId, base, ledger, until) {
    let v = +(base.itens[productId] || 0);
    for (const e of ledger) if (e.productId === productId && e.dataHora > base.dataHora && e.dataHora <= until) v += e.delta;
    return v;
  }

  /* Estoque estimado atual a partir da base ativa. */
  function computeStock(products, base, ledger) {
    const rows = new Map(products.map(p => [p.id, { productId: p.id, base: +(base.itens[p.id] || 0), entradas: 0, saidas: 0, ajustes: 0, movimentos: 0 }]));
    for (const e of ledger) {
      if (e.dataHora <= base.dataHora) continue;
      const r = rows.get(e.productId); if (!r) continue;
      r[e.cat === 'divisao' ? 'base' : e.cat] += e.delta; r.movimentos++;
    }
    for (const r of rows.values()) r.atual = r.base + r.entradas + r.saidas + r.ajustes;
    return rows;
  }

  function stockStatus(atual, minimo, pctCritico) {
    if (atual <= 0) return 'zerado';
    if (!minimo) return 'sem_minimo';
    if (atual <= minimo * (pctCritico / 100)) return 'critico';
    if (atual <= minimo) return 'baixo';
    return 'saudavel';
  }

  /* Lê a mensagem da logística: "Limão 260", "Copinhos de papel - 10.000". */
  function parseLogisticsMessage(text, products) {
    products = products.filter(p => !p.arquivado);
    const exact = new Map();
    for (const p of products) { exact.set(norm(p.nome), p.id); for (const a of p.vinculos || []) exact.set(norm(a), p.id); }
    const matched = {}, unmatched = [];
    let pending = '';
    for (const raw of String(text).split(/\r?\n/)) {
      // tira o prefixo do WhatsApp: "[14:39, 10/8/2026] +55 11 95962-7870: "
      let line = raw.replace(/^\s*\[[^\]]*\]\s*[^:]*:\s*/, '').trim();
      if (!line) continue;
      if (/aviso de contagem|^cliente\b|^itens?\s*:?$/i.test(line)) { pending = ''; continue; }
      const m = line.match(/(\d{1,3}(?:\.\d{3})+|\d+)\s*(?:unid\w*|uni\w*|und|un|pcs?)?\.?\s*$/i);
      if (!m) { pending = line; continue; }
      const qty = parseInt(m[1].replace(/\./g, ''), 10);
      let label = line.slice(0, m.index).replace(/[-–—:|=•*]+\s*$/, '').replace(/^[-–—•*\s]+/, '').trim();
      if (!label && pending) label = pending.replace(/[-–—:|=•*]+\s*$/, '').trim();
      pending = '';
      const name = norm(label);
      if (!name) { unmatched.push(line); continue; }
      let pid = exact.get(name);
      if (!pid) {
        const cands = products.filter(p => { const n = norm(p.nome); return n.includes(name) || name.includes(n); });
        if (cands.length === 1) pid = cands[0].id;
      }
      if (pid) matched[pid] = qty; else unmatched.push(label + ': ' + qty);
    }
    return { matched, unmatched };
  }

  /* ===== Teste obrigatório (seção 23) rodado em memória ===== */
  function runSelfTest() {
    const products = [{ id: 't1', nome: 'Limão', sku: 'LIM-TESTE', vinculos: [] }];
    const base = { id: 'T001', ehBase: true, dataHora: '2026-10-08T14:00:00', itens: { t1: 260 } };
    let ledger = [], seq = 0;
    const steps = [];
    const run = (nome, rows, esperado, esperadoStatus) => {
      const items = classifyRecords(rows, { products, ledger, baseDataHora: base.dataHora, defaultTipo: 'SAIDA', overrides: {} });
      const entries = buildEntries(items, { seqStart: seq, importId: nome, criadoEm: 'teste' });
      seq += entries.length; ledger = ledger.concat(entries);
      const obtido = computeStock(products, base, ledger).get('t1').atual;
      const statusOk = !esperadoStatus || items.every((it, k) => it.status === esperadoStatus[k]);
      steps.push({ nome, esperado, obtido, ok: obtido === esperado && statusOk,
        linhas: items.map(it => ({ pedido: it.parsed.pedido, data: it.parsed.dataHora, qtd: it.parsed.qtd, status: it.status })) });
    };
    run('Primeiro upload', [
      { pedido: '#001', data: '08/10/2026 10:00', sku: 'LIM-TESTE', quantidade: 10 },
      { pedido: '#002', data: '08/10/2026 13:00', sku: 'LIM-TESTE', quantidade: 5 },
      { pedido: '#003', data: '08/10/2026 15:00', sku: 'LIM-TESTE', quantidade: 20 },
      { pedido: '#004', data: '09/10/2026 10:00', sku: 'LIM-TESTE', quantidade: 15 }
    ], 225, ['anterior', 'anterior', 'nova', 'nova']);
    run('Segundo upload', [
      { pedido: '#003', data: '08/10/2026 15:00', sku: 'LIM-TESTE', quantidade: 20 },
      { pedido: '#004', data: '09/10/2026 10:00', sku: 'LIM-TESTE', quantidade: 15 },
      { pedido: '#005', data: '10/10/2026 11:00', sku: 'LIM-TESTE', quantidade: 10 },
      { pedido: '#006', data: '10/10/2026 16:00', sku: 'LIM-TESTE', quantidade: 5 }
    ], 210, ['duplicada', 'duplicada', 'nova', 'nova']);
    run('Segundo arquivo enviado de novo', [
      { pedido: '#003', data: '08/10/2026 15:00', sku: 'LIM-TESTE', quantidade: 20 },
      { pedido: '#004', data: '09/10/2026 10:00', sku: 'LIM-TESTE', quantidade: 15 },
      { pedido: '#005', data: '10/10/2026 11:00', sku: 'LIM-TESTE', quantidade: 10 },
      { pedido: '#006', data: '10/10/2026 16:00', sku: 'LIM-TESTE', quantidade: 5 }
    ], 210, ['duplicada', 'duplicada', 'duplicada', 'duplicada']);
    // Regra de data (seção 2) com ledger vazio
    const regra = classifyRecords([
      { pedido: '#120', data: '08/10/2026 10:00', sku: 'LIM-TESTE', quantidade: 1 },
      { pedido: '#121', data: '08/10/2026 13:59', sku: 'LIM-TESTE', quantidade: 1 },
      { pedido: '#122', data: '08/10/2026 14:00', sku: 'LIM-TESTE', quantidade: 1 },
      { pedido: '#123', data: '08/10/2026 14:01', sku: 'LIM-TESTE', quantidade: 1 },
      { pedido: '#124', data: '08/10/2026 16:30', sku: 'LIM-TESTE', quantidade: 1 },
      { pedido: '#125', data: '09/10/2026 09:00', sku: 'LIM-TESTE', quantidade: 1 }
    ], { products, ledger: [], baseDataHora: base.dataHora, defaultTipo: 'SAIDA', overrides: {} });
    const esperadoRegra = ['anterior', 'anterior', 'anterior', 'nova', 'nova', 'nova'];
    steps.push({ nome: 'Regra de data (#120 a #125)', esperado: 'IGNORAR ×3, PROCESSAR ×3',
      obtido: regra.map(r => r.status === 'anterior' ? 'IGNORAR' : 'PROCESSAR').join(', '),
      ok: regra.every((r, k) => r.status === esperadoRegra[k]),
      linhas: regra.map(it => ({ pedido: it.parsed.pedido, data: it.parsed.dataHora, qtd: it.parsed.qtd, status: it.status })) });
    return { ok: steps.every(s => s.ok), steps, final: computeStock(products, base, ledger).get('t1').atual };
  }

  const SEED = {
    cliente: '2.131 — Blessy',
    contagem: { id: 'C001', numero: 1, dataHora: '2026-10-08T14:00:00', origem: 'Logística (mensagem oficial)', obs: 'Contagem física oficial enviada pela logística. Ponto de partida do espelho de estoque.' },
    produtos: [
      ['Limão', 260, 'Sabores'], ['Maracujá', 73, 'Sabores'], ['Melancia', 38, 'Sabores'], ['Manga', 36, 'Sabores'],
      ['Morango c/ kiwi', 16, 'Sabores'], ['Abacaxi c/ hortelã', 62, 'Sabores'],
      ['Necessaire', 80, 'Brindes e acessórios'], ['Boné My Blessy Era', 113, 'Brindes e acessórios'], ['Boné logo B', 49, 'Brindes e acessórios'],
      ['Ecobag', 294, 'Brindes e acessórios'], ['Piranha de flor', 486, 'Brindes e acessórios'],
      ['Copinhos de papel', 10000, 'Copos e garrafas'], ['Garrafa de vidro', 2651, 'Copos e garrafas']
    ]
  };

  return { norm, nowNaive, parseDateTime, parseQty, parseTipo, identKey, classifyRecords, buildEntries, baseFor, estimateAt,
    computeStock, stockStatus, parseLogisticsMessage, runSelfTest, SEED };
})();

/* ---------- Repositório (IndexedDB). Trocar esta camada por chamadas a um backend no futuro. ---------- */
const STORES = ['products', 'counts', 'ledger', 'imports', 'errors', 'events', 'settings'];
const Repo = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('blessy-espelho-estoque', 1);
        rq.onupgradeneeded = () => { for (const s of STORES) if (!rq.result.objectStoreNames.contains(s)) rq.result.createObjectStore(s, { keyPath: 'id' }); };
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  all(store) {
    if (!this.ok) return Promise.resolve([]);
    return new Promise((res, rej) => {
      const rq = this.db.transaction(store).objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  /* Grava várias coleções numa única transação: ou tudo entra, ou nada entra. */
  commit(changes, clearFirst) {
    if (!this.ok) return Promise.resolve();
    const names = Object.keys(changes);
    return new Promise((res, rej) => {
      const tx = this.db.transaction(names, 'readwrite');
      for (const n of names) {
        const st = tx.objectStore(n);
        if (clearFirst) st.clear();
        for (const o of changes[n]) st.put(o);
      }
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
};

/* ---------- Leitura de CSV / XLSX ---------- */
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function parseCSV(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const cnt = ch => first.split(ch).length - 1;
  const delim = [';', ',', '\t'].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += ch; }
    else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function readSpreadsheet(file) {
  const buf = await file.arrayBuffer();
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.txt')) return { sheets: { 'CSV': parseCSV(decodeText(buf)) } };
  if (!window.XLSX) throw new Error('Não foi possível carregar o leitor de XLSX (sem internet?). Exporte o arquivo do Bling como CSV.');
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  const sheets = {};
  for (const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' });
  return { sheets };
}
function splitHeader(rows) {
  const hi = rows.findIndex(r => r.filter(c => String(c).trim() !== '').length >= 2);
  if (hi < 0) return { header: [], data: [] };
  const header = rows[hi].map((h, i) => String(h).trim() || `Coluna ${i + 1}`);
  const data = rows.slice(hi + 1).map((r, k) => ({ cells: r, linha: hi + k + 2 })).filter(r => r.cells.some(c => String(c).trim() !== ''));
  return { header, data };
}

    <div class="card metric click" data-go="importacoes"><div class="lab">Duplicadas</div><div class="val">${fmt(sum('duplicadas'))}</div><div class="sub">não descontadas de novo</div></div>
    <div class="card metric click" data-go="erros"><div class="lab">Com erro</div><div class="val ${pe ? 'neg' : ''}">${fmt(pe)}</div><div class="sub">${fmt(S.errors.length - pe)} já resolvidas</div></div>

      </div>

    </div>
    <div class="tablewrap" id="stocktable">${stockTable(rows)}</div>
  </div>`;
};
function daysAgo(n) { const d = new Date(Date.now() - n * 864e5); return d.toISOString().slice(0, 10); }
function stockTable(rows) {
  const q = C.norm(UI.q);
  const f = rows.filter(r => (!q || C.norm(r.p.nome + ' ' + r.p.sku).includes(q)) && (UI.status === 'todos' || r.status === UI.status) && (UI.cat === 'todas' || r.p.categoria === UI.cat));
  if (!f.length) return `<div class="empty">Nenhum produto com esses filtros.</div>`;
  const t = f.reduce((a, r) => { a.b += r.base; a.e += r.entradas; a.s += r.saidas; a.a += r.ajustes; a.t += r.atual; return a; }, { b: 0, e: 0, s: 0, a: 0, t: 0 });
  return `<table><thead><tr><th>SKU</th><th>Produto</th><th class="num">Estoque-base</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">Ajustes</th><th class="num">Estoque atual</th><th>Status</th></tr></thead><tbody>
  ${f.map(r => `<tr class="click" data-audit="${r.p.id}"><td class="mono">${r.p.sku ? esc(r.p.sku) : '<span class="muted">sem SKU</span>'}</td><td class="prod">${esc(pn(r.p))}<div class="muted small">${esc(r.p.categoria || '')}</div></td><td class="num">${fmt(r.base)}</td><td class="num ${dcls(r.entradas)}">${sgn(r.entradas)}</td><td class="num ${dcls(r.saidas)}">${sgn(r.saidas)}</td><td class="num ${dcls(r.ajustes)}">${sgn(r.ajustes)}</td><td class="num strong ${r.atual < 0 ? 'delta-neg' : ''}">${fmt(r.atual)}</td><td>${pill(r.status, STATUS_LABEL[r.status])}${r.atual < 0 ? ' <span class="pill bad">negativo</span>' : ''}</td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td>Total (${f.length})</td><td class="num">${fmt(t.b)}</td><td class="num">${sgn(t.e)}</td><td class="num">${sgn(t.s)}</td><td class="num">${sgn(t.a)}</td><td class="num">${fmt(t.t)}</td><td></td></tr></tfoot></table>`;
}
AFTER.painel = () => {

/* ---------------- AUDITORIA DO PRODUTO ---------------- */
function openAudit(pid) {
  const p = prodById(pid); const r = stockRows().find(x => x.p.id === pid);
  const bases = S.counts.filter(c => c.ehBase).sort((a, b) => a.dataHora < b.dataHora ? -1 : 1);
  const others = S.counts.filter(c => !c.ehBase);
  const entries = S.ledger.filter(e => e.productId === pid).sort((a, b) => a.dataHora < b.dataHora ? -1 : a.dataHora > b.dataHora ? 1 : a.seq - b.seq);
  const line = (e, run) => {
    let what;
    if (e.tipo === 'SAIDA' || e.tipo === 'ENTRADA') what = `${e.tipo === 'SAIDA' ? 'Pedido' : 'Entrada'} ${esc(e.ref || e.idUnico)} <span class="muted small">· ${e.importId ? 'importação ' + e.importId : e.origem === 'manual' ? 'lançada à mão' + (e.obs ? ' · ' + esc(e.obs) : '') : 'corrigida manualmente'}</span>`;
    else if (e.tipo === 'AJUSTE') what = `Ajuste: ${esc(e.motivo)}${e.obs ? ` <span class="muted small">· ${esc(e.obs)}</span>` : ''}`;
    else if (e.tipo === 'DIVISAO') what = `Divisão em modelos <span class="muted small">· ${esc(e.obs)}</span>`;
    else what = `Estorno de ${esc(e.estornoDe)}: ${esc(e.motivo)}`;
    return `<div class="tl ${e.estornadoPor ? 'reversed' : ''}"><div class="when">${fdt(e.dataHora, true)}</div><div class="what">${what} <span class="mono muted">${e.id}</span></div><div class="num ${dcls(e.delta)}">${sgn(e.delta)}</div><div class="run">${fmt(run)}</div></div>`;
  };
  let html = '';
  const pre = bases.length ? entries.filter(e => e.dataHora <= bases[0].dataHora) : [];
  if (pre.length) html += `<details class="period"><summary>Lançamentos anteriores à primeira contagem (${pre.length}) — já contemplados na contagem</summary>${pre.map(e => line(e, 0)).join('')}</details>`;
  bases.forEach((b, i) => {
    const next = bases[i + 1];
    const es = entries.filter(e => e.dataHora > b.dataHora && (!next || e.dataHora <= next.dataHora));
    const infos = others.filter(c => c.dataHora > b.dataHora && (!next || c.dataHora <= next.dataHora));
    let run = +(b.itens[pid] || 0);
    let body = `<div class="tl basehead"><div class="when">${fdt(b.dataHora, true)}</div><div><b>Contagem-base ${countLabel(b)}</b> <span class="small">· ${esc(b.origem || 'logística')}</span></div><div class="num"><b>+${fmt(run)}</b></div><div class="run">${fmt(run)}</div></div>`;
    const timeline = [...es.map(e => ({ t: e.dataHora, e })), ...infos.map(c => ({ t: c.dataHora, c }))].sort((x, y) => x.t < y.t ? -1 : x.t > y.t ? 1 : 0);
    for (const it of timeline) {
      if (it.e) { run += it.e.delta; body += line(it.e, run); }
      else { const fis = +(it.c.itens[pid] ?? 0); body += `<div class="tl countinfo"><div class="when">${fdt(it.c.dataHora, true)}</div><div>Contagem ${countLabel(it.c)} registrada (não virou base): logística informou <b>${fmt(fis)}</b>, nosso estimado era ${fmt(run)} → ${sgn(fis - run)}</div><div></div><div class="run"></div></div>`; }
    }
    if (next) {
      const fis = +(next.itens[pid] ?? 0);
      const cz = next.conciliacao && next.conciliacao.rows.find(x => x.productId === pid);
      const est = cz ? cz.nosso : run;
      body += `<div class="tl countinfo"><div class="when">${fdt(next.dataHora, true)}</div><div>Contagem ${countLabel(next)}: estimado <b>${fmt(est)}</b>, logística informou <b>${fmt(fis)}</b> · divergência <b class="${dcls(fis - est)}">${sgn(fis - est)}</b>. A contagem virou o novo estoque-base.</div><div></div><div class="run"></div></div>`;
      html += `<details class="period"><summary>Período da base ${countLabel(b)} (${fdt(b.dataHora, true)} → ${fdt(next.dataHora, true)}) · ${es.length} lançamentos</summary>${body}</details>`;
    } else {
      body += `<div class="tl final"><div class="when">agora</div><div>Estoque estimado atual</div><div class="num">${fmt(run)}</div><div class="run"></div></div>`;
      html += `<div class="timeline">${body}</div>`;
    }
  });
  openModal({ title: pn(p), wide: true, sub: `${p.sku ? 'SKU ' + esc(p.sku) + ' · ' : 'Sem SKU cadastrado · '}${esc(p.categoria || '')} · mínimo ${p.estoqueMinimo ? fmt(p.estoqueMinimo) : 'não definido'}`,
    body: `<div class="calc"><div class="card metric"><div class="lab">Estoque-base</div><div class="val">${fmt(r.base)}</div></div><div class="card metric"><div class="lab">Entradas</div><div class="val">${sgn(r.entradas)}</div></div><div class="card metric"><div class="lab">Saídas</div><div class="val">${sgn(r.saidas)}</div></div><div class="card metric"><div class="lab">Ajustes</div><div class="val">${sgn(r.ajustes)}</div></div><div class="card metric hero"><div class="lab">Estoque atual</div><div class="val">${fmt(r.atual)}</div></div></div>
    <p class="muted small">Base ${fmt(r.base)} + entradas ${fmt(r.entradas)} − saídas ${fmt(Math.abs(r.saidas))} ${r.ajustes < 0 ? '−' : '+'} ajustes ${fmt(Math.abs(r.ajustes))} = <b>${fmt(r.atual)}</b>. Abaixo, cada lançamento que levou a esse número, com o saldo acumulado.</p>${html}`,
    foot: `<button class="btn" data-act="newEntry" data-pid="${pid}">+ Entrada</button><button class="btn" data-act="newAdjust" data-pid="${pid}">+ Ajuste</button>${p.arquivado ? '' : `<button class="btn" data-act="splitProduct" data-pid="${pid}">Dividir em modelos</button>`}<button class="btn" data-act="editProduct" data-pid="${pid}">Editar produto</button><button class="btn primary" data-act="closeModal">Fechar</button>` });
}

/* ---------------- AJUSTE MANUAL ---------------- */
const MOTIVOS = ['Envio para evento', 'Envio para influenciadora / creator', 'Brinde / ação de marketing', 'Avaria / perda', 'Devolução', 'Recebimento de mercadoria', 'Correção de lançamento', 'Outro'];
function openEntry(pid) {
  const m = openModal({ title: 'Registrar entrada', sub: 'Mercadoria que chegou na logística. Soma na coluna Entradas.',
    body: `<div class="field"><label for="enP">Produto</label><select class="input" id="enP">${sortedProducts().map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(pn(p))}</option>`).join('')}</select></div>
    <div class="form2"><div class="field"><label for="enQ">Quantidade recebida</label><input class="input" id="enQ" type="number" min="1" step="1" inputmode="numeric" placeholder="500"></div>
    <div class="field"><label for="enD">Data e hora do recebimento</label><input class="input" id="enD" type="datetime-local" value="${toLocalInput(C.nowNaive())}"></div></div>
    <div class="form2"><div class="field"><label for="enN">Nota fiscal ou documento</label><input class="input" id="enN" placeholder="Ex.: NF 1234"><span class="hint">Se essa entrada também aparecer na planilha do Bling, use o mesmo número para não contar duas vezes.</span></div>
    <div class="field"><label for="enO">Fornecedor / observação</label><input class="input" id="enO" placeholder="Ex.: reposição gráfica"></div></div>
    <div id="enPrev" class="notice" style="margin:0"></div>`,
    foot: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="enGo">Registrar entrada</button>` });
  const prev = () => {
    const p = m.querySelector('#enP').value, q = parseInt(m.querySelector('#enQ').value, 10) || 0, d = fromLocalInput(m.querySelector('#enD').value);
    const r = stockRows().find(x => x.p.id === p); const b = activeBase(); const el = m.querySelector('#enPrev');
    if (d && d <= b.dataHora) { el.className = 'notice warn'; el.innerHTML = `<div>Essa data é anterior à contagem-base (${fdt(b.dataHora)}), então a contagem já inclui essa mercadoria. A entrada fica registrada, mas não altera o estoque atual.</div>`; }
    else { el.className = 'notice'; el.innerHTML = `<div>${esc(prodName(p))}: <b>${fmt(r.atual)}</b> → <b>${fmt(r.atual + q)}</b></div>`; }
  };
  ['#enP', '#enQ', '#enD'].forEach(x => m.querySelector(x).addEventListener('input', prev)); prev();
  m.querySelector('#enGo').onclick = async () => {
    const p = m.querySelector('#enP').value, q = Number(m.querySelector('#enQ').value), d = fromLocalInput(m.querySelector('#enD').value);
    if (!Number.isInteger(q) || q <= 0) return toast('Informe a quantidade recebida.', true);
    if (!d) return toast('Informe a data do recebimento.', true);
    const doc = m.querySelector('#enN').value.trim(), obs = m.querySelector('#enO').value.trim();
    const key = doc ? ['P', C.norm(doc), p, 'ENTRADA', q].join('|') : null;
    if (key && S.ledger.some(e => e.key === key)) return toast('Essa nota já foi lançada para este produto com essa quantidade.', true);
    const id = nextId('M', 6);
    const e = { id, seq: S.settings.seq.M, tipo: 'ENTRADA', cat: 'entradas', delta: q, productId: p, dataHora: d, ref: doc || 'sem documento', obs, key, looseKey: doc ? ['P', C.norm(doc), p, 'ENTRADA'].join('|') : null, origem: 'manual', criadoEm: C.nowNaive() };
    await save({ ledger: [e], events: [mkEvent('entrada', `Entrada ${id}: ${prodName(p)} +${fmt(q)}${doc ? ' (' + doc + ')' : ''}${obs ? ' · ' + obs : ''}`)] });
    closeModal(); toast(`Entrada registrada: ${prodName(p)} +${fmt(q)}`); render();
  };
}
function openAdjust(pid) {
  let sentido = 'SAIDA';
  const m = openModal({ title: 'Novo ajuste manual', sub: 'O ajuste entra no ledger e fica registrado no histórico do produto.',
    body: `<div class="field"><label for="ajP">Produto</label><select class="input" id="ajP">${sortedProducts().map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(pn(p))}${p.sku ? ' · ' + esc(p.sku) : ''}</option>`).join('')}</select></div>
    <div class="form2"><div class="field"><label>Movimento</label><div class="seg" id="ajS"><button type="button" data-s="SAIDA" class="on">Saída</button><button type="button" data-s="ENTRADA">Entrada</button></div></div>
    <div class="field"><label for="ajQ">Quantidade</label><input class="input" id="ajQ" type="number" min="1" step="1" inputmode="numeric" placeholder="10"></div></div>
    <div class="form2"><div class="field"><label for="ajM">Motivo</label><select class="input" id="ajM">${MOTIVOS.map(x => `<option>${x}</option>`).join('')}</select></div>
    <div class="field"><label for="ajD">Data e hora</label><input class="input" id="ajD" type="datetime-local" value="${toLocalInput(C.nowNaive())}"></div></div>
    <div class="field"><label for="ajO">Observação</label><input class="input" id="ajO" placeholder="Ex.: evento X, creator Y"></div>
    <div id="ajPrev" class="notice" style="margin:0"></div>`,
    foot: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="ajGo">Registrar ajuste</button>` });
  const prev = () => {
    const p = m.querySelector('#ajP').value, q = parseInt(m.querySelector('#ajQ').value, 10) || 0, d = fromLocalInput(m.querySelector('#ajD').value);
    const r = stockRows().find(x => x.p.id === p); const b = activeBase();
    const after = r.atual + (sentido === 'SAIDA' ? -q : q);
    const el = m.querySelector('#ajPrev');
    if (d && d <= b.dataHora) { el.className = 'notice warn'; el.innerHTML = `<div>Essa data é anterior à contagem-base ativa (${fdt(b.dataHora)}). O ajuste fica registrado no histórico, mas <b>não altera</b> o estoque atual, porque a contagem já reflete esse momento.</div>`; }
    else { el.className = 'notice' + (after < 0 ? ' bad' : ''); el.innerHTML = `<div>${esc(prodName(p))}: <b>${fmt(r.atual)}</b> → <b>${fmt(after)}</b>${after < 0 ? ' · o estoque ficaria negativo' : ''}</div>`; }
  };
  m.querySelector('#ajS').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; sentido = b.dataset.s; m.querySelectorAll('#ajS button').forEach(x => x.classList.toggle('on', x === b)); prev(); };
  ['#ajP', '#ajQ', '#ajD'].forEach(s => m.querySelector(s).addEventListener('input', prev)); prev();
  m.querySelector('#ajGo').onclick = async () => {
    const p = m.querySelector('#ajP').value, qv = m.querySelector('#ajQ').value, d = fromLocalInput(m.querySelector('#ajD').value);
    const q = Number(qv);
    if (!Number.isInteger(q) || q <= 0) return toast('Informe uma quantidade inteira maior que zero.', true);
    if (!d) return toast('Informe data e hora.', true);
    const motivo = m.querySelector('#ajM').value, obs = m.querySelector('#ajO').value.trim();
    if (motivo === 'Outro' && !obs) return toast('Explique o motivo na observação.', true);
    const id = nextId('M', 6);
    const e = { id, seq: S.settings.seq.M, tipo: 'AJUSTE', cat: 'ajustes', delta: sentido === 'SAIDA' ? -q : q, sentido, productId: p, dataHora: d, motivo, obs, origem: 'manual', criadoEm: C.nowNaive() };
    await save({ ledger: [e], events: [mkEvent('ajuste', `Ajuste ${id}: ${prodName(p)} ${sgn(e.delta)} (${motivo}${obs ? ' · ' + obs : ''})`)] });
    closeModal(); toast(`Ajuste registrado: ${prodName(p)} ${sgn(e.delta)}`); render();
  };
}

  if (st === 1) return head + `

  if (st === 2) return head + mappingView();

AFTER.importar = () => {
  const drop = document.getElementById('drop');

document.getElementById('fileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleFile(f); });

async function handleFile(f) {
  try {
    const { sheets } = await readSpreadsheet(f);
    resetImport(); IMP.file = { name: f.name, size: f.size }; IMP.sheets = sheets;
    selectSheet(Object.keys(sheets).find(n => sheets[n].length) || Object.keys(sheets)[0]);
    if (!IMP.data.length) { toast('Não encontrei linhas com dados nesse arquivo.', true); resetImport(); return render(); }
    IMP.step = 2; if (route !== 'importar') go('importar'); else render();
  } catch (e) { toast('Não consegui ler o arquivo: ' + e.message, true); }
}
function selectSheet(n) {
  IMP.sheet = n; const { header, data } = splitHeader(IMP.sheets[n] || []);
  IMP.header = header; IMP.data = data;
  const saved = S.settings.mappings[headerSig(header)];
  if (saved) { IMP.mapping = {}; for (const [k, name] of Object.entries(saved.cols)) { const i = header.indexOf(name); if (i >= 0) IMP.mapping[k] = i; } IMP.defaultTipo = saved.defaultTipo || 'SAIDA'; IMP.fromSaved = true; }
  else { IMP.mapping = guessMapping(header); IMP.fromSaved = false; }
}

function mappingProblem() {
  const m = IMP.mapping;
  if (m.data == null) return 'Escolha a coluna de Data.';
  if (m.quantidade == null) return 'Escolha a coluna de Quantidade.';
  if (m.pedido == null && m.idUnico == null) return 'Escolha a coluna do Nº do pedido (ou do ID único).';
  if (m.sku == null && m.produto == null) return 'Escolha a coluna de SKU ou de Produto.';
  return '';
}
function bindMapping() {
  const upd = () => { const p = mappingProblem(); document.getElementById('mapMsg').textContent = p || 'Vou classificar cada linha antes de qualquer lançamento.'; document.getElementById('analisar').disabled = !!p; };
  document.querySelectorAll('[data-map]').forEach(s => s.onchange = () => { const v = s.value; if (v === '') delete IMP.mapping[s.dataset.map]; else IMP.mapping[s.dataset.map] = +v; upd(); });
  document.getElementById('defTipo').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; IMP.defaultTipo = b.dataset.t; document.querySelectorAll('#defTipo button').forEach(x => x.classList.toggle('on', x === b)); };
  const ss = document.getElementById('sheetSel'); if (ss) ss.onchange = () => { selectSheet(ss.value); render(); };
  document.getElementById('analisar').onclick = () => { analyze(); IMP.step = 3; render(); };
  upd();
}
function recordsFromData() {
  const m = IMP.mapping;
  return IMP.data.map(r => {
    const rec = { _linha: r.linha, _original: Object.fromEntries(IMP.header.map((h, i) => [h, r.cells[i]])) };
    for (const f of FIELDS) if (m[f.k] != null) rec[f.k] = r.cells[m[f.k]];
    return rec;
  });
}
function classifyCtx(extra) {
  return Object.assign({ products: S.products, ledger: S.ledger, baseDataHora: activeBase().dataHora, defaultTipo: IMP.defaultTipo, overrides: IMP.overrides }, extra || {});
}
function analyze() { IMP.items = C.classifyRecords(recordsFromData(), classifyCtx()); }
function importCounts(items) {
  const c = { linhas: items.length, novas: 0, duplicadas: 0, anteriores: 0, erros: 0 };
  for (const i of items) { if (i.status === 'nova') c.novas++; else if (i.status === 'duplicada') c.duplicadas++; else if (i.status === 'anterior') c.anteriores++; else c.erros++; }
  return c;
}

function bindPreview() {
  document.getElementById('pvchips').onclick = e => { const b = e.target.closest('[data-pv]'); if (!b) return; PV_FILTER = b.dataset.pv; render(); };
  document.querySelectorAll('[data-link]').forEach(s => s.onchange = () => { if (s.value) IMP.overrides[s.dataset.link] = s.value; else delete IMP.overrides[s.dataset.link]; analyze(); render(); });
  document.getElementById('processar').onclick = processImport;
}
async function processImport() {
  const btn = document.getElementById('processar'); btn.disabled = true;
  analyze(); // reclassifica contra o ledger atual, por segurança
  const items = IMP.items; const c = importCounts(items);
  const importId = nextId('I', 4); const now = C.nowNaive();
  const entries = C.buildEntries(items, { seqStart: S.settings.seq.M, importId, criadoEm: now, origem: 'bling' });
  S.settings.seq.M += entries.length;
  const errs = items.filter(i => i.status === 'erro').map(i => ({ id: nextId('E', 5), importId, linha: i.linha, original: i.original, raw: stripPrivate(i.raw), codigo: i.codigo, problema: i.problema, solucao: i.solucao, parsed: i.parsed, status: 'pendente', criadoEm: now, defaultTipo: IMP.defaultTipo }));
  // vínculos escolhidos viram aliases permanentes
  const prodChanges = [];
  for (const [k, pid] of Object.entries(IMP.overrides)) {
    const p = prodById(pid); const val = k.replace(/^(sku|nome):/, '');
    const original = items.find(i => i.parsed.ident === k); const raw = original ? (k.startsWith('sku:') ? original.raw.sku : original.raw.produto) : val;
    if (!(p.vinculos || []).some(v => C.norm(v) === C.norm(raw))) { const np = clone(p); np.vinculos = [...(np.vinculos || []), String(raw).trim()]; prodChanges.push(np); }
  }
  const sig = headerSig(IMP.header);
  S.settings.mappings[sig] = { cols: Object.fromEntries(Object.entries(IMP.mapping).map(([k, i]) => [k, IMP.header[i]])), defaultTipo: IMP.defaultTipo };
  const imp = Object.assign({ id: importId, arquivo: IMP.file.name, aba: IMP.sheet, criadoEm: now, baseCountId: activeBase().id, mapping: S.settings.mappings[sig].cols, defaultTipo: IMP.defaultTipo, status: c.erros ? 'Concluída com erros' : 'Concluída',
    itens: items.map(i => ({ linha: i.linha, status: i.status, pedido: i.parsed.pedido || i.parsed.idUnico, dataHora: i.parsed.dataHora || null, productId: i.parsed.productId || null, tipo: i.parsed.tipo || null, qtd: i.parsed.qtd ?? null, problema: i.problema || null, raw: i.raw.sku || i.raw.produto || '' })) }, c);
  const ev = [mkEvent('importacao', `Importação ${importId} (${IMP.file.name}): ${c.novas} novas, ${c.duplicadas} já processadas, ${c.anteriores} anteriores à base, ${c.erros} com erro.`)];
  if (prodChanges.length) ev.push(mkEvent('produto', `Vínculos do Bling salvos: ${prodChanges.map(p => p.nome + ' ← ' + p.vinculos[p.vinculos.length - 1]).join('; ')}`));
  await save({ ledger: entries, imports: [imp], errors: errs, products: prodChanges, events: ev });
  IMP.result = { importId, ...c }; IMP.step = 4; render();
  toast(`${c.novas} movimentações lançadas no estoque.`);
}
const stripPrivate = r => Object.fromEntries(Object.entries(r).filter(([k]) => !k.startsWith('_')));
function doneView() {
  const r = IMP.result;
  return `<div class="notice ok"><div class="grow"><b>Importação ${r.importId} concluída.</b> ${fmt(r.novas)} movimentações lançadas no ledger. ${fmt(r.duplicadas)} já processadas e ${fmt(r.anteriores)} anteriores à base foram ignoradas.${r.erros ? ` ${fmt(r.erros)} linha(s) com erro aguardam correção.` : ''}</div></div>
  <div class="actions"><a class="btn primary" href="#painel">Ver estoque atualizado</a><button class="btn" data-act="openImport" data-id="${r.importId}">Detalhes da importação</button>${r.erros ? `<a class="btn" href="#erros">Corrigir erros</a>` : ''}<button class="btn" data-act="importRestart">Importar outro arquivo</button></div>`;
}

/* ---------------- LEDGER / MOVIMENTAÇÕES ---------------- */
function filteredLedger() {
  const f = UI.mv; const q = C.norm(f.q);
  return [...S.ledger].filter(e => (!f.prod || e.productId === f.prod) && (!f.tipo || e.tipo === f.tipo) && (!f.de || e.dataHora >= f.de + 'T00:00:00') && (!f.ate || e.dataHora <= f.ate + 'T23:59:59')
    && (!q || C.norm([e.ref, e.idUnico, e.id, e.motivo, e.obs, e.importId, prodName(e.productId)].join(' ')).includes(q)))
    .sort((a, b) => a.dataHora < b.dataHora ? 1 : a.dataHora > b.dataHora ? -1 : b.seq - a.seq);
}

function openFixError(id) {

      ${r.sku || r.produto ? `<label class="small" style="font-weight:500;display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" id="fxLink" checked> Lembrar "${esc(r.sku || r.produto)}" como este produto</label>` : ''}</div>

    <div id="fxRes" class="notice" style="margin:0"><div>Ajuste os campos e clique em Verificar.</div></div>`,
    foot: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn" id="fxCheck">Verificar</button><button class="btn primary" id="fxGo" disabled>Reprocessar</button>` });
  let last = null;
  const build = force => ({ pedido: m.querySelector('#fxPed').value, data: fromLocalInput(m.querySelector('#fxD').value).replace('T', ' '), quantidade: m.querySelector('#fxQ').value, tipo: m.querySelector('#fxT').value === 'ENTRADA' ? 'entrada' : 'saida', _productId: m.querySelector('#fxP').value || null, idUnico: r.idUnico, sku: r.sku, produto: r.produto, _force: force });
  const check = force => {
    const rec = build(force);
    if (!rec._productId) { m.querySelector('#fxRes').className = 'notice bad'; m.querySelector('#fxRes').innerHTML = '<div>Escolha o produto.</div>'; return null; }
    const it = C.classifyRecords([rec], { products: S.products, ledger: S.ledger, baseDataHora: activeBase().dataHora, defaultTipo: 'SAIDA', overrides: {} })[0];
    const el = m.querySelector('#fxRes'); const go = m.querySelector('#fxGo');
    go.disabled = true; go.textContent = 'Reprocessar';
    if (it.status === 'nova') { el.className = 'notice ok'; el.innerHTML = `<div>Pronto para lançar: ${esc(prodName(it.parsed.productId))} ${sgn(it.parsed.tipo === 'SAIDA' ? -it.parsed.qtd : it.parsed.qtd)} em ${fdt(it.parsed.dataHora)}.</div>`; go.disabled = false; }
    else if (it.status === 'erro' && it.codigo === 'qtd_divergente') { el.className = 'notice warn'; el.innerHTML = `<div class="grow">${esc(it.problema)}<br><span class="small">${esc(it.solucao)}</span></div><button class="btn sm" id="fxForce">Processar mesmo assim</button>`; m.querySelector('#fxForce').onclick = () => check(true); }
    else if (it.status === 'erro') { el.className = 'notice bad'; el.innerHTML = `<div>${esc(it.problema)}</div>`; }
    else { el.className = 'notice warn'; el.innerHTML = `<div>${it.status === 'duplicada' ? 'Essa movimentação já está no ledger' : 'A data é anterior ou igual à contagem-base: já está contemplada na contagem'}. Não há o que lançar. Você pode marcar o erro como resolvido sem lançar.</div>`; go.disabled = false; go.textContent = 'Resolver sem lançar'; }
    last = it; return it;
  };

  m.querySelector('#fxGo').onclick = async () => {
    if (!last) return;

      const ent = C.buildEntries([last], { seqStart: S.settings.seq.M, importId: null, erroId: e.id, criadoEm: now, origem: 'correcao' })[0];
      S.settings.seq.M += 1; ent.importIdOrigem = e.importId; changes.ledger = [ent];
      upd.status = 'resolvida'; upd.resolucao = `Corrigido e lançado como ${ent.id} em ${fdt(now)} (${prodName(ent.productId)} ${sgn(ent.delta)}).`;
      changes.events.push(mkEvent('correcao', `Erro ${e.id} corrigido e lançado como ${ent.id}: ${prodName(ent.productId)} ${sgn(ent.delta)}`));
    } else {
      upd.status = 'resolvida'; upd.resolucao = `Resolvido sem lançamento em ${fdt(now)}: ${last.status === 'duplicada' ? 'já estava no ledger' : 'anterior à contagem-base'}.`;
      changes.events.push(mkEvent('correcao', `Erro ${e.id} resolvido sem lançamento (${last.status}).`));
    }
    const link = m.querySelector('#fxLink');
    if (link && link.checked && last.parsed.productId && (r.sku || r.produto)) {
      const p = clone(prodById(last.parsed.productId)); const v = String(r.sku || r.produto).trim();
      if (!(p.vinculos || []).some(x => C.norm(x) === C.norm(v))) { p.vinculos = [...(p.vinculos || []), v]; changes.products = [p]; }

  };

}

/* ---------------- CONTAGENS E CONCILIAÇÃO ---------------- */
function conciliationRows(count) {
  if (count.conciliacao) return count.conciliacao.rows;
  const base = C.baseFor(S.counts, count.dataHora);
  if (!base) return null;
  return sortedProducts().map(p => {
    const nosso = C.estimateAt(p.id, base, S.ledger, count.dataHora);
    const fis = +(count.itens[p.id] ?? 0); const diff = fis - nosso;
    return { productId: p.id, nosso, fisico: fis, diff, pct: nosso ? diff / nosso * 100 : (fis ? 100 : 0) };
  });
}
function concSummary(rows) {
  const div = rows.filter(r => r.diff !== 0);
  const nosso = rows.reduce((a, r) => a + r.nosso, 0);
  const abs = rows.reduce((a, r) => a + Math.abs(r.diff), 0);
  return { skus: div.length, abs, liq: rows.reduce((a, r) => a + r.diff, 0), pct: nosso ? abs / nosso * 100 : 0, nosso, fisico: rows.reduce((a, r) => a + r.fisico, 0) };
}
const pctFmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

VIEWS.contagens = () => {
  if (UI.countView) return conciliationView(S.counts.find(c => c.id === UI.countView));

  return `<div class="page-head"><div><h1>Contagens da logística</h1><p>Cada contagem física fica guardada. Uma nova contagem é comparada com o nosso estoque estimado no mesmo instante e, depois da conciliação, pode virar o novo ponto de partida.</p></div><div class="actions"><button class="btn primary" data-act="newCount">+ Registrar nova contagem</button></div></div>
  ${baseStrip()}
  <div class="panel tablewrap"><table><thead><tr><th>Contagem</th><th>Data/hora</th><th>Origem</th><th class="num">Unidades contadas</th><th>Situação</th><th>Divergência</th><th></th></tr></thead><tbody>
  ${list.map(c => { const tot = Object.values(c.itens).reduce((a, x) => a + +x, 0); const rows = c.numero > 1 ? conciliationRows(c) : null; const sm = rows ? concSummary(rows) : null;

    <td>${c.id === act.id ? pill('accent', 'Base ativa') : c.ehBase ? pill('neutral', 'Base anterior') : c.dataHora <= act.dataHora ? pill('neutral', 'Registrada (anterior à base)') : pill('warn', 'Aguardando decisão')}</td>
    <td class="small">${sm ? (sm.skus ? `${sm.skus} SKU(s) · ${fmt(sm.abs)} un.` : 'Sem divergência') : '<span class="muted">contagem inicial</span>'}</td><td><span class="btn ghost sm">${c.numero > 1 ? 'Conciliação' : 'Ver'}</span></td></tr>`; }).join('')}
  </tbody></table></div>`;
};
function conciliationView(c) {
  const act = activeBase();
  if (c.numero === 1 || !C.baseFor(S.counts, c.dataHora)) {
    return `<div class="page-head"><div><h1>Contagem ${countLabel(c)}</h1><p>${fdt(c.dataHora)} · ${esc(c.origem || '')}</p></div><div class="actions"><button class="btn" data-act="backCounts">← Contagens</button></div></div>
    ${c.obs ? `<div class="notice"><div>${esc(c.obs)}</div></div>` : ''}

  return `<div class="page-head"><div><h1>Conciliação ${countLabel(c)}</h1><p>Estoque estimado pelo sistema em ${fdt(c.dataHora)} (base ${countLabel(base)} + movimentações até esse instante) comparado com a contagem física da logística.</p></div>
  <div class="actions"><button class="btn" data-act="backCounts">← Contagens</button><button class="btn" data-act="exportConc" data-id="${c.id}" data-k="csv">CSV</button><button class="btn" data-act="exportConc" data-id="${c.id}" data-k="xlsx">XLSX</button></div></div>
  ${c.conciliacao ? `<div class="notice ok"><div>Conciliação registrada em ${fdt(c.conciliacao.registradaEm)}. Esta contagem virou estoque-base nessa data; os números abaixo estão congelados.</div></div>` : `<div class="notice"><div>Os números do estimado são recalculados com o ledger atual até você definir esta contagem como base. Se ainda faltam pedidos do Bling até ${fdt(c.dataHora)}, importe-os antes de decidir.</div></div>`}
  <div class="grid-cards">
    <div class="card metric"><div class="lab">Nosso estoque</div><div class="val">${fmt(sm.nosso)}</div><div class="sub">estimado</div></div>
    <div class="card metric"><div class="lab">Logística</div><div class="val">${fmt(sm.fisico)}</div><div class="sub">contado</div></div>

    <div class="card metric"><div class="lab">Unidades divergentes</div><div class="val">${fmt(sm.abs)}</div><div class="sub">saldo líquido ${sgn(sm.liq)}</div></div>

  </div>
  <div class="panel tablewrap"><table><thead><tr><th>SKU</th><th>Produto</th><th class="num">Nosso estoque</th><th class="num">Logística</th><th class="num">Diferença</th><th class="num">%</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r => { const p = prodById(r.productId) || { nome: r.productId }; return `<tr class="click" data-audit="${r.productId}"><td class="mono">${p.sku ? esc(p.sku) : '<span class="muted">—</span>'}</td><td class="prod">${esc(pn(p))}</td><td class="num">${fmt(r.nosso)}</td><td class="num">${fmt(r.fisico)}</td><td class="num strong ${dcls(r.diff)}">${sgn(r.diff)}</td><td class="num ${dcls(r.diff)}">${r.diff ? pctFmt(r.pct) : '0%'}</td><td>${r.diff ? pill('warn', 'Divergente') : pill('ok', 'OK')}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${canBase ? `<div class="confirmbar"><div><h3>Definir esta contagem como novo estoque-base</h3><p class="muted small">A contagem ${countLabel(c)} passa a ser o ponto de partida. A base ${countLabel(act)}, as movimentações, os ajustes e esta divergência continuam no histórico.</p></div><button class="btn primary" data-act="setBase" data-id="${c.id}">Definir como novo estoque-base</button></div>` : ''}
  ${!c.ehBase && !canBase ? `<div class="notice warn" style="margin-top:14px"><div>Esta contagem é anterior à base ativa (${countLabel(act)}), então não pode virar base. Ela fica registrada como referência.</div></div>` : ''}`;
}

async function setBase(id) {
  const c = S.counts.find(x => x.id === id); const act = activeBase();
  const pendBefore = pendingErrors().filter(e => e.parsed && e.parsed.dataHora && e.parsed.dataHora <= c.dataHora).length;
  const ok = await confirmBox({ title: `Definir ${countLabel(c)} como novo estoque-base?`, ok: 'Definir como base',
    text: `A partir de agora, o estoque estimado parte da contagem de ${fdt(c.dataHora)}, e só entram movimentações posteriores a esse horário. A base ${countLabel(act)} e todo o histórico continuam guardados.${pendBefore ? `<br><br><b>Atenção:</b> existem ${pendBefore} erro(s) pendente(s) com data até esse horário. Depois da troca, eles passam a ser considerados anteriores à base.` : ''}` });
  if (!ok) return;
  const rows = conciliationRows(c); const sm = concSummary(rows);
  const nc = clone(c); nc.ehBase = true; nc.status = 'base'; nc.baseDesde = C.nowNaive();
  nc.conciliacao = { rows, resumo: sm, baseId: C.baseFor(S.counts, c.dataHora).id, registradaEm: C.nowNaive() };
  const old = clone(act); old.status = 'base_anterior';
  S.settings.baseCountId = nc.id;
  await save({ counts: [nc, old], events: [mkEvent('base', `Contagem ${countLabel(nc)} definida como novo estoque-base (antes: ${countLabel(act)}). Divergência registrada: ${sm.skus} SKU(s), ${fmt(sm.abs)} un. (${sgn(sm.liq)} líquido).`)] });
  toast(`${countLabel(nc)} agora é o estoque-base.`); render();
}

const SPLIT_SUGESTOES = { ecobag: ['Ecobag Blessy', 'Ecobag Greens Club', 'Bolsa Greens Club'] };
function openSplit(pid) {
  const p = prodById(pid); const base = activeBase();
  const at = C.nowNaive() > base.dataHora ? base.dataHora.slice(0, 17) + '01' : base.dataHora;
  const qtdBase = C.estimateAt(pid, base, S.ledger, at);
  const atual = stockRows().find(r => r.p.id === pid).atual;
  const later = S.ledger.filter(e => e.productId === pid && e.dataHora > at).length;
  const nomes = SPLIT_SUGESTOES[C.norm(p.nome)] || ['', ''];
  const rowHtml = (n, i) => `<div class="filters" data-row><input class="input" style="flex:1;min-width:0" data-nm placeholder="Nome do modelo" value="${esc(n)}" aria-label="Nome do modelo ${i + 1}"><input class="input num" style="width:110px" type="number" min="0" step="1" data-q placeholder="Qtd" aria-label="Quantidade do modelo ${i + 1}"></div>`;
  const m = openModal({ title: `Dividir ${p.nome} em modelos`, sub: `Na contagem ${countLabel(base)} a logística informou <b>${fmt(qtdBase)}</b> un. de ${esc(pn(p))}. Preencha quantas são de cada modelo.`,
    body: `<div class="stack" id="spRows">${nomes.map(rowHtml).join('')}</div>
    <button class="btn sm" id="spAdd" style="align-self:flex-start">+ Outro modelo</button>
    <div id="spRes" class="notice" style="margin:0"></div>
    ${later ? `<div class="notice warn" style="margin:0"><div>${esc(pn(p))} já tem ${later} lançamento(s) depois da contagem. Eles continuam no produto antigo; confira depois se precisa de ajuste.</div></div>` : ''}
    <p class="small muted">${esc(pn(p))} sai da tabela e cada modelo vira um produto, com o histórico ligado ao original. Os SKUs dos modelos podem ser cadastrados depois em Produtos.</p>`,
    foot: `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" id="spGo">Dividir</button>` });
  const rows = () => [...m.querySelectorAll('[data-row]')].map(r => ({ nome: r.querySelector('[data-nm]').value.trim(), q: r.querySelector('[data-q]').value.trim() })).filter(r => r.nome || r.q);
  const upd = () => {
    const tot = rows().reduce((a, r) => a + (+r.q || 0), 0); const el = m.querySelector('#spRes');
    const falta = qtdBase - tot;
    el.className = 'notice ' + (falta === 0 ? 'ok' : 'warn');
    el.innerHTML = `<div>Soma dos modelos: <b>${fmt(tot)}</b> de ${fmt(qtdBase)}${falta === 0 ? ' · confere com a contagem' : falta > 0 ? ` · faltam ${fmt(falta)}` : ` · passou ${fmt(-falta)}`}</div>`;
  };
  m.querySelector('#spRows').addEventListener('input', upd); upd();
  m.querySelector('#spAdd').onclick = () => { m.querySelector('#spRows').insertAdjacentHTML('beforeend', rowHtml('', m.querySelectorAll('[data-row]').length)); };
  m.querySelector('#spGo').onclick = async () => {
    const rs = rows();
    if (rs.length < 2) return toast('Informe pelo menos dois modelos.', true);
    if (rs.some(r => !r.nome)) return toast('Dê um nome para cada modelo.', true);
    if (rs.some(r => r.q === '' || !Number.isInteger(+r.q) || +r.q < 0)) return toast('Preencha a quantidade de cada modelo (pode ser 0).', true);
    if (new Set(rs.map(r => C.norm(r.nome))).size !== rs.length || rs.some(r => S.products.some(x => !x.arquivado && C.norm(x.nome) === C.norm(r.nome)))) return toast('Há nome de modelo repetido ou igual a um produto que já existe.', true);
    const tot = rs.reduce((a, r) => a + +r.q, 0);
    if (tot !== qtdBase) {
      const ok = await confirmBox({ title: 'A soma não bate com a contagem', ok: 'Dividir mesmo assim', text: `Os modelos somam ${fmt(tot)}, mas a contagem tinha ${fmt(qtdBase)} de ${esc(pn(p))}. A diferença de ${sgn(tot - qtdBase)} fica registrada no histórico. Se preferir, confirme os números com a logística antes.` });
      if (!ok) return;
    }
    await doSplit(p, rs, qtdBase, at, '');
    closeModal(); toast(`${p.nome} dividido em ${rs.length} modelos.`); render();
  };
}
async function doSplit(p, rs, qtdBase, at, fonte) {
    const base = activeBase(); const tot = rs.reduce((a, r) => a + +r.q, 0);
    const now = C.nowNaive(); const novos = []; const ents = [];
    const mk = (prodId, delta, obs) => { const id = nextId('M', 6); ents.push({ id, seq: S.settings.seq.M, tipo: 'DIVISAO', cat: 'divisao', delta, productId: prodId, dataHora: at, motivo: 'Divisão em modelos', obs, origem: 'manual', criadoEm: now }); };
    rs.forEach((r, i) => { const np = { id: nextId('P', 3), nome: r.nome, sku: '', categoria: p.categoria, unidade: p.unidade, estoqueMinimo: 0, observacao: `Modelo de ${p.nome}`, vinculos: [], emoji: EMOJI_PADRAO[C.norm(r.nome)] || p.emoji || '', ordem: (p.ordem || 0) + (i + 1) / 100, origemDe: p.id, criadoEm: now }; novos.push(np); });
    mk(p.id, -qtdBase, `${p.nome} dividido em ${rs.map(r => r.nome).join(', ')}`);
    rs.forEach((r, i) => mk(novos[i].id, +r.q, `veio de ${p.nome} (contagem ${countLabel(base)})`));
    const old = Object.assign(clone(p), { arquivado: true, arquivadoEm: now, observacao: `Dividido em: ${rs.map(r => r.nome + ' ' + r.q).join(', ')}` });
    await save({ products: [old, ...novos], ledger: ents, events: [mkEvent('produto', `${p.nome} (${fmt(qtdBase)} un.) dividido em modelos: ${rs.map(r => `${r.nome} ${fmt(+r.q)}`).join(', ')}${tot !== qtdBase ? ` · diferença ${sgn(tot - qtdBase)}` : ''}.${fonte ? ' ' + fonte : ''}`)] });
}
