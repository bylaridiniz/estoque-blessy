document.getElementById('backupInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d; try { d = JSON.parse(decodeText(await f.arrayBuffer())); } catch (err) { return toast('Arquivo inválido: não é um JSON de backup.', true); }
  if (d.app !== 'blessy-espelho-estoque' || !Array.isArray(d.products) || !Array.isArray(d.counts) || !Array.isArray(d.ledger) || !d.settings) return toast('Esse arquivo não é um backup do Espelho de Estoque.', true);
  const ok = await confirmBox({ title: 'Importar backup?', ok: 'Substituir pelos dados do backup', danger: true,
    text: `Backup de <b>${fdt(d.exportadoEm)}</b>: ${d.products.length} produtos, ${d.counts.length} contagens, ${fmt(d.ledger.length)} lançamentos, ${d.imports.length} importações.<br><br>Os dados atuais deste navegador (${fmt(S.ledger.length)} lançamentos) serão substituídos. Se quiser guardá-los, exporte um backup antes.` });
  if (!ok) return;
  for (const k of ['products', 'counts', 'ledger', 'imports', 'errors', 'events']) S[k] = d[k] || [];
  S.settings = d.settings;
  S.events.push(mkEvent('backup', `Backup de ${fdt(d.exportadoEm)} importado (${fmt(d.ledger.length)} lançamentos).`));
  try { await Repo.commit({ products: S.products, counts: S.counts, ledger: S.ledger, imports: S.imports, errors: S.errors, events: S.events, settings: [S.settings] }, true); await (Remote.running || Promise.resolve()); await load(); toast('Backup importado.'); }
  catch (err) { toast('Falha ao gravar o backup: ' + err.message, true); }
  render();
});
function stockExportRows() {
  return [['SKU', 'Produto', 'Categoria', 'Estoque-base', 'Entradas', 'Saídas', 'Ajustes', 'Estoque atual', 'Mínimo', 'Status'], ...stockRows().map(r => [r.p.sku, r.p.nome, r.p.categoria, r.base, r.entradas, r.saidas, r.ajustes, r.atual, r.p.estoqueMinimo || '', STATUS_LABEL[r.status]])];
}
function importsExportRows() {
  return [['ID', 'Data', 'Arquivo', 'Linhas', 'Novas', 'Duplicadas', 'Ignoradas', 'Erros', 'Status'], ...S.imports.map(i => [i.id, fdt(i.criadoEm), i.arquivo, i.linhas, i.novas, i.duplicadas, i.anteriores, i.erros, i.status])];
}

/* ---------------- Ações globais ---------------- */
const ACTIONS = {
  closeModal, newAdjust: el => openAdjust(el.dataset.pid), newEntry: el => openEntry(el.dataset.pid), editProduct: el => openProduct(el.dataset.pid), splitProduct: el => openSplit(el.dataset.pid), newProduct: () => openProduct(null),
  importRestart: () => { resetImport(); PV_FILTER = 'todas'; go('importar'); render(); },
  sample: el => sampleFile(el.dataset.n),
  openImport: el => openImportDetail(el.dataset.id), reverse: el => openReverse(el.dataset.id),
  fixError: el => openFixError(el.dataset.id), discardError: el => openDiscard(el.dataset.id),
  toggleResolved: () => { UI.errShowResolved = !UI.errShowResolved; render(); },
  newCount: openNewCount, backCounts: () => { UI.countView = null; render(); }, setBase: el => setBase(el.dataset.id),
  exportConc: el => concExport(el.dataset.id, el.dataset.k),
  exportLedger: el => exportTable('ledger_estoque', ledgerExportRows([...S.ledger].sort((a, b) => a.dataHora < b.dataHora ? -1 : 1)), el.dataset.k),
  exportStock: el => exportTable('estoque_atual', stockExportRows(), el.dataset.k),
  exportImports: el => exportTable('importacoes', importsExportRows(), el.dataset.k),
  exportAll: () => { try { saveFile(`historico_estoque_${C.nowNaive().slice(0, 10)}.xlsx`, xlsxOf([['Estoque atual', stockExportRows()], ['Ledger', ledgerExportRows([...S.ledger].sort((a, b) => a.dataHora < b.dataHora ? -1 : 1))], ['Importações', importsExportRows()], ['Contagens', [['Contagem', 'Data/hora', 'Origem', 'Base', ...sortedProducts().map(p => p.nome)], ...S.counts.map(c => [countLabel(c), fdt(c.dataHora), c.origem, c.ehBase ? 'sim' : 'não', ...sortedProducts().map(p => c.itens[p.id] ?? '')])]], ['Eventos', [['Quando', 'Tipo', 'Descrição'], ...S.events.map(e => [fdt(e.em), e.tipo, e.texto])]]])); } catch (e) { toast(e.message, true); } },
  logout: async () => { try { await SB.auth.signOut(); } catch (e) {} location.reload(); },
  exportBackup, retrySave: () => Remote.queue(), changeAuthor: async () => { await askAuthor(); renderFoot(); },
  runTest: () => { lastTest = C.runSelfTest(); render(); },
  savePct: async () => { const v = Number(document.getElementById('pctC').value); if (!Number.isInteger(v) || v < 1 || v > 100) return toast('Use um número entre 1 e 100.', true); S.settings.pctCritico = v; await save({ events: [mkEvent('config', `Limite de estoque crítico alterado para ${v}% do mínimo.`)] }); toast('Limite salvo.'); render(); },
  resetAll: async () => {
    if (document.getElementById('resetTxt').value.trim() !== 'APAGAR') return toast('Digite APAGAR para confirmar.', true);
    const st = seedState(); Object.assign(S, st); S.events.push(mkEvent('sistema', 'Dados restaurados para a Contagem-base #001 (08/10/2026 14:00).'));
    await Repo.commit({ products: S.products, counts: S.counts, ledger: [], imports: [], errors: [], events: S.events, settings: [S.settings] }, true);
    await (Remote.running || Promise.resolve()); await load(); resetImport(); toast('Dados restaurados.'); go('painel'); render();
  }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (a) { e.preventDefault(); const f = ACTIONS[a.dataset.act]; if (f) f(a); return; }
  const au = e.target.closest('[data-audit]'); if (au) { openAudit(au.dataset.audit); return; }
  const gv = e.target.closest('[data-go]'); if (gv) { go(gv.dataset.go); return; }
  const ct = e.target.closest('[data-count]'); if (ct) { UI.countView = ct.dataset.count; render(); window.scrollTo(0, 0); return; }
  const im = e.target.closest('[data-imp]'); if (im) { openImportDetail(im.dataset.imp); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Início ---------- */
function supaLogin() {
  return new Promise(resolve => {
    const v = document.getElementById('view');
    const show = (msg, bad) => {
      v.innerHTML = `<div style="max-width:420px;margin:8vh auto 0" class="card stack"><h1>Espelho de Estoque</h1><p class="muted">Entre com o seu e-mail da Blessy.</p>
      ${msg ? `<div class="notice ${bad ? 'bad' : 'ok'}" style="margin:0"><div>${msg}</div></div>` : ''}
      <form id="lgF" class="stack"><div class="field"><label for="lgE">E-mail</label><input class="input" id="lgE" type="email" autocomplete="email" required></div>
      <div class="field"><label for="lgS">Senha</label><input class="input" id="lgS" type="password" autocomplete="current-password" minlength="6" required></div>
      <div class="actions"><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" id="lgNovo">Primeiro acesso: criar senha</button></div></form></div>`;
      const f = v.querySelector('#lgF');
      const go = async criar => {
        const email = f.querySelector('#lgE').value.trim().toLowerCase(), password = f.querySelector('#lgS').value;
        if (!email || password.length < 6) return show('Preencha o e-mail e uma senha com pelo menos 6 caracteres.', true);
        const r = criar ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
        if (r.error) return show(criar ? 'Não consegui criar o acesso: ' + esc(r.error.message) : 'E-mail ou senha incorretos. Se é sua primeira vez, use "Primeiro acesso".', true);
        if (!r.data.session) return show('Acesso criado. Confirme pelo link enviado ao seu e-mail e depois entre aqui.', false);
        check();
      };
      f.onsubmit = e => { e.preventDefault(); go(false); };
      v.querySelector('#lgNovo').onclick = () => go(true);
    };
    const check = async () => {
      const { data } = await SB.auth.getSession();
      if (!data.session) return show('');
      SB_EMAIL = data.session.user.email;
      const { data: ok, error } = await SB.rpc('estoque_autorizado');
      if (error) { v.innerHTML = `<div class="notice bad"><div>Erro ao falar com o Supabase: ${esc(error.message)}</div></div>`; return; }
      if (!ok) { v.innerHTML = `<div style="max-width:460px;margin:8vh auto 0" class="card stack"><h2>Quase lá</h2><p><b>${esc(SB_EMAIL)}</b> ainda não está liberado para o estoque. Peça para a Lari incluir seu e-mail.</p><button class="btn" data-act="logout" style="align-self:flex-start">Sair</button></div>`; return; }
      resolve();
    };
    check();
  });
}
(async () => {
  if (SUPA_CFG) {
    if (!window.supabase || /COLE_/.test(SUPA_CFG.url + SUPA_CFG.key)) { document.getElementById('view').innerHTML = `<div class="notice bad"><div><b>Falta configurar o Supabase.</b> Coloque a URL e a chave anon do projeto no início do arquivo.</div></div>`; return; }
    SB = window.supabase.createClient(SUPA_CFG.url, SUPA_CFG.key);
    await supaLogin();
  }
  try { await load(); }
  catch (e) {
    document.getElementById('view').innerHTML = `<div class="notice bad"><div class="grow"><b>Não consegui abrir os dados do Google Drive.</b> ${esc(e && e.message || e)}<br>Recarregue a página. Se continuar, confira se a planilha "Estoque Blessy" e o arquivo de dados ainda existem.</div></div>`;
    return;
  }
  if (IS_GOOGLE && !autor()) await askAuthor();
  const r = location.hash.slice(1); route = VIEWS[r] ? r : 'painel';
  render(); getDownloads();
  window.__estoque = { S, Core: C, Repo };
})();
})();
</script>
